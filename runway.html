<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snow Runway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0614;color-scheme:dark}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0614}}
  :root[data-theme="dark"]{--bg:#0b0614}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   SNOW RUNWAY — 홀리데이 뷰티 런웨이 액션 (오리지널 캐릭터 'LUNA')
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, GY = 0, PX = 0, VIG = null;
const R = (a, b) => a + Math.random() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
};
const FT = 'Montserrat, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const FS = '"Playfair Display", Georgia, serif';
const KF = '"Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
let BEST = 0; try { BEST = +localStorage.getItem('snowrunway_best') || 0; } catch (e) { }

/* ===================== THEMES ===================== */
const THEMES = [
  { name: 'SNOW AVENUE', ko: '노을 진 눈의 거리', sky: ['#2b1d4a', '#9c4f7d', '#f4b7a8'], far: '#4a3260', mid: '#2c1f40', ground: ['#f3f5fb', '#c9cfe2'], acc: '255,150,190', win: ['255,214,150', '255,180,200'], icy: false },
  { name: 'CRYSTAL BRIDGE', ko: '얼음빛 크리스털 브리지', sky: ['#081530', '#22508a', '#94c8ec'], far: '#1c3560', mid: '#11223f', ground: ['#e4f2ff', '#9fc0e0'], acc: '140,210,255', win: ['190,230,255', '255,240,200'], icy: true },
  { name: 'MIDNIGHT RUNWAY', ko: '자정의 런웨이', sky: ['#06030d', '#28103b', '#6e2b6c'], far: '#21122f', mid: '#130a1d', ground: ['#e9e0f2', '#a99bbd'], acc: '255,90,200', win: ['255,120,220', '150,200,255'], icy: true },
];
let SKY = [];
function makeSkyline(th, layer) {
  const TW = Math.max(1600, Math.ceil(W + 300)), hh = Math.max(2, Math.ceil(layer ? H * .42 : H * .55));
  const c = document.createElement('canvas'); c.width = TW; c.height = hh; const g = c.getContext('2d');
  let x = 0;
  while (x < TW) {
    const bw = R(50, 150) * S, bh = layer ? R(.25, .95) * hh : R(.3, 1) * hh, y = hh - bh;
    g.fillStyle = layer ? th.mid : th.far; g.fillRect(x, y, bw, bh);
    if (Math.random() < .3) { g.fillRect(x + bw * .45, y - 18 * S, 3 * S, 18 * S); }
    if (Math.random() < .25) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + bw / 2, y - 26 * S); g.lineTo(x + bw, y); g.fill(); }
    const ws = (layer ? 7 : 4) * S, gap = (layer ? 9 : 7) * S;
    for (let wy = y + gap; wy < hh - gap; wy += ws + gap) for (let wx = x + gap * .8; wx < x + bw - ws; wx += ws + gap) {
      if (Math.random() < (layer ? .32 : .22)) { g.fillStyle = `rgba(${th.win[RI(0, 1)]},${R(.35, .9)})`; g.fillRect(wx, wy, ws, ws * 1.3); }
    }
    if (layer && Math.random() < .3) { // 지붕 눈
      g.fillStyle = 'rgba(240,245,255,.85)'; g.fillRect(x - 2, y - 3 * S, bw + 4, 5 * S);
    }
    x += bw + R(0, 12) * S;
  }
  return c;
}
function prerender() {
  SKY = THEMES.map(th => ({ far: makeSkyline(th, 0), mid: makeSkyline(th, 1) }));
  VIG = document.createElement('canvas'); VIG.width = Math.max(2, W); VIG.height = Math.max(2, H);
  const g = VIG.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,0,20,.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  S = clamp(Math.min(H / 760, W / 560), .55, 1.35); GY = H * .8; PX = Math.max(90 * S, W * .24);
  prerender();
  if (P) { P.x = PX; if (P.onGround) P.y = GY; }
}

/* ===================== SPRITES ===================== */
const glowCache = {};
function glow(rgb) {
  if (glowCache[rgb]) return glowCache[rgb];
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, `rgba(${rgb},1)`); gr.addColorStop(.45, `rgba(${rgb},.35)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return glowCache[rgb] = c;
}
function drawGlow(rgb, x, y, r, a) { if (a <= 0 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glow(rgb), x - r, y - r, r * 2, r * 2); }
function star4(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = i % 2 ? r * .28 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ===================== AUDIO ===================== */
let AC = null, master = null, musGain = null, noiseBuf = null, MUTED = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = .55; musGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    MUS.next = AC.currentTime + .1;
  } catch (e) { AC = null; }
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function note(f, t, d, type, vol, out = master, slide = 1) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(out); o.start(t); o.stop(t + d + .05);
}
function noise(t, d, vol, f0, f1, type = 'lowpass', out = master) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; const fl = AC.createBiquadFilter(); fl.type = type;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + d + .05);
}
const PENTA = [0, 2, 4, 7, 9];
const now = () => AC ? AC.currentTime : 0;
const sfx = {
  jump() { note(520, now(), .18, 'sine', .12, master, 1.8); },
  djump() { note(700, now(), .22, 'sine', .12, master, 2); noise(now(), .25, .08, 1500, 6000, 'bandpass'); },
  slide() { noise(now(), .35, .12, 4000, 400); },
  gem(i) { const k = i % 10, m = 76 + 12 * Math.floor(k / 5) + PENTA[k % 5]; note(mf(m), now(), .25, 'sine', .09); note(mf(m + 12), now(), .15, 'triangle', .03); },
  lip() { [0, 4, 7, 12].forEach((s, i) => note(mf(84 + s), now() + i * .05, .3, 'triangle', .07)); },
  heart() { [0, 7, 12].forEach((s, i) => note(mf(72 + s), now() + i * .07, .4, 'sine', .1)); },
  hurt() { note(180, now(), .4, 'sawtooth', .14, master, .4); noise(now(), .3, .25, 1200, 100); },
  shutter() { const t = now(); noise(t, .04, .35, 8000, 3000, 'highpass'); noise(t + .07, .05, .25, 6000, 2000, 'highpass'); },
  perfect() { note(mf(91), now(), .5, 'sine', .1); note(mf(98), now() + .06, .6, 'sine', .08); },
  fever() { const t = now(); noise(t, .9, .2, 300, 8000, 'bandpass'); [62, 66, 69, 74, 78].forEach((m, i) => note(mf(m), t + .5 + i * .04, 1, 'triangle', .07)); },
  smash() { noise(now(), .3, .3, 5000, 300); note(mf(88), now(), .2, 'square', .03); },
  land() { noise(now(), .12, .08, 1200, 200); },
  click() { note(1200, now(), .05, 'square', .03); },
};
// 왈츠 BGM (3/4)
const MUS = { next: 0, beat: 0 };
const CH = [[62, 65, 69], [62, 67, 70], [60, 64, 67], [60, 65, 69], [62, 65, 70], [62, 67, 70], [61, 64, 69], [61, 64, 69]];
const BASS = [38, 43, 36, 41, 34, 43, 33, 33];
const MEL = [[74, 77, 81], [79, 77, 74], [76, 79, 72], [77, 81, 84], [82, 81, 77], [79, 74, 77], [76, 73, 69], [81, 76, 73]];
function musicTick() {
  if (!AC || MUTED) { if (AC) MUS.next = AC.currentTime + .05; return; }
  const sp = state === 'play' ? clamp(G.curSpd / (430 * S), 1, 1.8) : 1;
  const spb = 60 / (150 * (1 + (sp - 1) * .45));
  while (MUS.next < AC.currentTime + .12) {
    const t = MUS.next, b = MUS.beat % 3, bar = Math.floor(MUS.beat / 3) % 8;
    if (b === 0) { note(mf(BASS[bar]), t, .55, 'triangle', .22, musGain); }
    else for (const m of CH[bar]) note(mf(m), t, .28, 'sine', .035, musGain);
    if (state !== 'over') note(mf(MEL[bar][b]), t, b === 0 ? .7 : .35, 'triangle', b === 0 ? .045 : .03, musGain);
    if (G && G.feverT > 0) { noise(t, .05, .06, 9000, 6000, 'highpass', musGain); if (b === 0) note(55, t, .3, 'sine', .25, musGain, .5); }
    MUS.next += spb; MUS.beat++;
  }
}

/* ===================== INPUT ===================== */
const keys = {}; let usedTouch = false;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return; keys[e.code] = true; audioInit();
  const c = e.code;
  if (c === 'KeyM') { MUTED = !MUTED; if (master) master.gain.value = MUTED ? 0 : .5; return; }
  if (state === 'title') { if (c === 'Space' || c === 'Enter' || c === 'ArrowUp') startGame(); return; }
  if (state === 'over') { if ((c === 'Space' || c === 'Enter' || c === 'KeyR') && G.overShow > 1.2) startGame(); return; }
  if (c === 'KeyP' || c === 'Escape') { state = state === 'pause' ? 'play' : state === 'play' ? 'pause' : state; return; }
  if (state === 'pause') { state = 'play'; return; }
  if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') doJump();
  if (c === 'ArrowDown' || c === 'KeyS') doSlide();
  if (c === 'KeyZ' || c === 'KeyX' || c === 'Enter') doPose();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { if (state === 'play') state = 'pause'; });
function poseBtn() { return { x: W / 2, y: H - 70 * S, r: 46 * S }; }
function pointer(x, y, right) {
  audioInit();
  if (state === 'title') return startGame();
  if (state === 'over') { if (G.overShow > 1.2) startGame(); return; }
  if (state === 'pause') { state = 'play'; return; }
  const b = poseBtn();
  if (G.zone && G.inZone && !G.zone.done && Math.hypot(x - b.x, y - b.y) < b.r * 1.4) return doPose();
  if (right) doSlide(); else doJump();
}
cv.addEventListener('mousedown', e => { if (usedTouch) return; pointer(e.clientX, e.clientY, e.button === 2); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => {
  e.preventDefault(); usedTouch = true;
  for (const t of e.changedTouches) {
    const b = poseBtn();
    if (state === 'play' && G.zone && G.inZone && !G.zone.done && Math.hypot(t.clientX - b.x, t.clientY - b.y) < b.r * 1.4) { doPose(); continue; }
    pointer(t.clientX, t.clientY, state === 'play' && t.clientX < W * .4);
  }
}, { passive: false });

/* ===================== STATE ===================== */
let state = 'title', G = null, P = null, tReal = 0;
let OBS = [], ITEMS = [], PT = [], RINGS = [], POPS = [], BANNERS = [], AFTER = [], FLY = [], FLASHES = [];
const FX = { shake: 0, zoom: 0, flash: 0, flashCol: '255,255,255', red: 0, slowT: 0, slowTo: .3, ts: 1, hitStop: 0, mag: null, slam: null };
const SNOW = [], BOKEH = [];
const GRAV = () => 2700 * S;

function makeG() {
  return { score: 0, shown: 0, dist: 0, speed: 430 * S, curSpd: 430 * S, combo: 0, comboT: 0, comboPulse: 0, maxCombo: 0, fever: 0, feverT: 0,
    stage: 0, stagePrev: 0, stageFade: 0, spawnCD: 500 * S, photoT: 14, zone: null, inZone: false, time: 0, overT: 0, overShow: 0,
    gems: 0, perfects: 0, poses: 0, smashes: 0, scroll: 0, heartFx: [0, 0, 0], scorePulse: 0, lastStage: 0 };
}
const J0 = () => ({ lean: 0, hip: 0, tF: 0, kF: 0, tB: 0, kB: 0, aF: 0, eF: 0, aB: 0, eB: 0, head: 0 });
function newPlayer() {
  return { x: PX, y: GY, vy: 0, onGround: true, jumps: 0, coyote: 0, jumpBuf: 0, slideT: 0, slideQ: false, spin: 0, spinT: 0, hp: 3, inv: 0, hurtT: 0,
    alive: true, ph: 0, J: J0(), sq: 1, sqV: 0, posing: 0, afterT: 0, blink: 0, blinkT: 2 };
}
function initScene() {
  SNOW.length = 0; for (let i = 0; i < 170; i++) SNOW.push({ x: R(0, W), y: R(0, H), z: R(.3, 1.6), ph: R(0, TAU) });
  BOKEH.length = 0; for (let i = 0; i < 22; i++) BOKEH.push({ x: R(0, W), y: R(0, GY * .9), r: R(14, 46), c: RI(0, 3), ph: R(0, TAU) });
}
function clearWorld() { OBS = []; ITEMS = []; PT = []; RINGS = []; POPS = []; BANNERS = []; AFTER = []; FLY = []; FLASHES = []; FX.mag = null; FX.slam = null; }
function initTitle() { clearWorld(); G = makeG(); P = newPlayer(); state = 'title'; }
function startGame() {
  audioInit(); clearWorld(); const keepScroll = G ? G.scroll : 0; G = makeG(); G.scroll = keepScroll; P = newPlayer(); state = 'play';
  FX.flash = .7; FX.flashCol = '255,255,255'; FX.zoom = .05; shake(6);
  ring(P.x, P.y - 60 * S, Math.max(W, H) * .6, .8, 8, '255,170,210');
  slam('GO!', '255,150,200');
  banner(THEMES[0].name, 'STAGE 1 · ' + THEMES[0].ko, THEMES[0].acc);
  sfx.shutter();
}

/* ===================== FX ===================== */
function part(o) { if (PT.length > 1800) return; o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0; o.grow = o.grow || 0; o.drag = o.drag ?? 1; o.rot = o.rot || 0; o.vr = o.vr || 0; o.g = o.g || 0; o.scroll = o.scroll ?? 1; PT.push(o); }
function ring(x, y, maxR, dur, w, rgb) { RINGS.push({ x, y, maxR, dur, w, rgb, t: 0 }); }
function popup(x, y, text, size, color, dur = .9, font = FT) { POPS.push({ x, y, text, size, color, dur, t: 0, font }); }
function banner(title, sub, rgb, dur = 2.6) { BANNERS.push({ title, sub, rgb, t: 0, dur }); }
function slam(text, rgb) { FX.slam = { text, rgb, t: 0 }; }
function shake(v) { FX.shake = Math.max(FX.shake, v); }
function slowmo(t, to) { FX.slowT = Math.max(FX.slowT, t); FX.slowTo = to; }
function sparkleBurst(x, y, n, rgb, sp = 300) {
  for (let i = 0; i < n; i++) { const a = R(0, TAU), v = R(sp * .3, sp); part({ type: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.4, .9), size: R(4, 10) * S, drag: .05, rgb, vr: R(-6, 6), scroll: .6 }); }
}
function camFlash(x, y, big) { FLASHES.push({ x, y, t: 0, big }); }

/* ===================== ACTIONS ===================== */
function doJump() {
  if (state !== 'play' || !P.alive || P.posing > 0) return;
  P.jumpBuf = .14;
}
function doSlide() {
  if (state !== 'play' || !P.alive || P.posing > 0) return;
  if (P.onGround) startSlide();
  else { P.vy = Math.max(P.vy, 1300 * S); P.slideQ = true; P.spinT = 0; P.spin = 0; }
}
function startSlide() {
  P.slideT = .72; sfx.slide();
  for (let i = 0; i < 12; i++) part({ type: 'puff', x: P.x + R(-10, 30) * S, y: GY - R(0, 8) * S, vx: R(-260, -60) * S, vy: R(-120, -20) * S, life: R(.4, .8), size: R(5, 12) * S, grow: 20 * S, drag: .2 });
}
function doPose() {
  if (state !== 'play' || !P.alive || P.posing > 0) return;
  if (!(G.zone && G.inZone && !G.zone.done)) { if (P.onGround) popup(P.x, P.y - 150 * S, '포토존에서 POSE!', 14 * S, '#ffd1e6', .7, KF); return; }
  if (!P.onGround) { P.vy = 1400 * S; }
  G.zone.done = true; G.poses++; P.posing = 1.5; P.slideT = 0;
  const bonus = 1500 + G.combo * 30; G.score += bonus; G.scorePulse = 1;
  G.fever = Math.min(100, G.fever + 40);
  slowmo(1.4, .06); FX.flash = 1; FX.flashCol = '255,255,255'; FX.zoom = .12; shake(8);
  FX.mag = { t: 0, bonus, n: G.poses };
  sfx.shutter(); setTimeout(sfx.shutter, 220); setTimeout(sfx.shutter, 430);
  for (let i = 0; i < 10; i++) setTimeout(() => camFlash(R(W * .1, W * .9), R(H * .2, GY - 40 * S), true), i * 60);
  sparkleBurst(P.x, P.y - 70 * S, 40, '255,200,230', 500);
}

/* ===================== SPAWNING ===================== */
const OB = {
  snowman: { w: 50, h: 90, kind: 'ground' },
  gifts: { w: 62, h: 70, kind: 'ground' },
  tree: { w: 74, h: 172, kind: 'ground' },
  banner: { w: 150, h: 46, kind: 'over', bottom: 64 },
  drone: { w: 62, h: 26, kind: 'drone', bottom: 70 },
};
function spawnChunk() {
  const st = G.stage, x0 = W + 80 * S, spd = G.speed;
  if (G.photoT <= 0 && !G.zone) {
    const len = 950 * S;
    G.zone = { x: x0, len, done: false, flashT: 0, announced: false };
    for (let i = 0; i < 9; i++) ITEMS.push(mkItem('gem', x0 + 60 * S + i * 95 * S, GY - 40 * S - Math.sin(i / 8 * Math.PI) * 60 * S));
    G.spawnCD = len + spd * .9; G.photoT = R(24, 30); return;
  }
  const pool = ['snowman', 'gifts', 'snowman', 'gifts', 'banner', 'banner'];
  if (G.time > 8) pool.push('drone', 'tree');
  if (st >= 1 || G.time > 30) pool.push('drone', 'tree', 'banner');
  const type = pool[RI(0, pool.length - 1)], d = OB[type];
  const o = { type, kind: d.kind, x: x0, w: d.w * S, h: (type === 'gifts' ? R(52, 72) : d.h) * S, t: R(0, 10), minGap: 1e9, passed: false, hit: false };
  if (d.bottom) o.bottom = d.bottom * S;
  OBS.push(o);
  // 아이템 패턴
  const cx = o.x + o.w / 2;
  if (o.kind === 'ground') {
    const hgt = type === 'tree' ? 250 : 150, n = 6;
    for (let i = 0; i < n; i++) { const k = i / (n - 1); ITEMS.push(mkItem('gem', cx - 150 * S + k * 300 * S, GY - 50 * S - Math.sin(k * Math.PI) * hgt * S)); }
  } else {
    for (let i = 0; i < 5; i++) ITEMS.push(mkItem('gem', cx - 100 * S + i * 50 * S, GY - 28 * S));
  }

  ctx.fillText('Luna’s', lx, H * .5); ctx.fillText('Winter Glow', lx, H * .5 + 22 * S); ctx.font = `800 ${10 * S + 2}px ${FT}`; ctx.fillStyle = '#ffd1e3'; ctx.fillText('5 LOOKS FOR THE NIGHT', lx, H * .5 + 44 * S);
  // 스탬프
  const sk = ease.outBack(clamp((k - .2) / .3, 0, 1));
  if (sk > 0) {
    ctx.save(); ctx.translate(W * .7, H * .5); ctx.rotate(-.18); ctx.scale(sk * 1, sk * 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e83a6a'; const sw = Math.min(260 * S, W * .5); roundRect(-sw / 2, -34 * S, sw, 68 * S, 10 * S); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `italic 900 ${Math.min(32 * S, sw / 7)}px ${FT}`; ctx.fillText('PERFECT SHOT!', 0, -6 * S);
    ctx.font = `900 ${16 * S}px ${FT}`; ctx.fillText('+' + m.bonus.toLocaleString(), 0, 20 * S);
    ctx.restore();
  }
  // 빛 줄기 스윕
  const sx = lerp(-W * .3, W * 1.3, clamp(k / .8, 0, 1));
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + 80 * S, 0); ctx.lineTo(sx - 120 * S, H); ctx.lineTo(sx - 200 * S, H); ctx.fill();
  ctx.restore(); ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic'; ctx.globalCompositeOperation = 'source-over';
}
function drawTitle() {
  const t = tReal;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(15,5,25,.55)'); g.addColorStop(.5, 'rgba(15,5,25,0)'); g.addColorStop(1, 'rgba(15,5,25,.4)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cy = H * .2;
  let size = 100 * S; ctx.font = `italic 900 ${size}px ${FS}`;
  const words = ['Snow', 'Runway'];
  const tw = ctx.measureText('Snow Runway').width; if (tw > W * .9) size *= W * .9 / tw;
  ctx.font = `italic 900 ${size}px ${FS}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const full = 'Snow Runway', ws = [...full].map(c => ctx.measureText(c).width), total = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  [...full].forEach((c, i) => {
    const k = clamp((t - .2 - i * .06) / .55, 0, 1), e = ease.outBack(k);
    ctx.save(); ctx.translate(x + ws[i] / 2, cy + (1 - e) * 70 + Math.sin(t * 2 + i * .5) * 3 * S); ctx.rotate((1 - e) * .5); ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(255,90,160,.7)'; ctx.textAlign = 'center'; ctx.fillText(c, 3, 3);
    const gr = ctx.createLinearGradient(0, -size / 2, 0, size / 2); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#ffc6de');
    ctx.fillStyle = gr; ctx.fillText(c, 0, 0); ctx.restore();
    x += ws[i];
  });
  ctx.globalAlpha = 1;
  // 반짝이
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) { const sx = W / 2 - total / 2 + hash(Math.floor(t * .8) * 4 + i) * total, sy = cy + (hash(i * 7 + Math.floor(t * .8)) - .5) * size * .6, ph = (t * .8) % 1; ctx.fillStyle = '#fff'; ctx.globalAlpha = Math.sin(ph * Math.PI); star4(sx, sy, 14 * S * Math.sin(ph * Math.PI), t * 2); }
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.font = `800 ${Math.max(9, Math.min(13 * S, W / 48))}px ${FT}`; ctx.fillStyle = '#ffd6e8'; ctx.textAlign = 'center';
  const k2 = ease.outCubic(clamp((t - .9) / .8, 0, 1)); ctx.globalAlpha = k2;
  spaced('HOLIDAY  RUNWAY  ACTION  ·  STARRING  LUNA', W / 2, cy + size * .62, lerp(14, 3, k2));
  ctx.fillStyle = '#ffd6e8'; ctx.fillRect(W / 2 - 140 * S * k2, cy + size * .62 + 14 * S, 280 * S * k2, 1.5);
  ctx.globalAlpha = 1;
  const py = Math.min(H * .52, GY - 190 * S);
  if (t > 1.2 && Math.floor(t * 2) % 2 === 0) { ctx.font = `900 ${Math.max(15, 20 * S)}px ${KF}`; ctx.fillStyle = '#fff'; ctx.fillText('탭 / SPACE 로 런웨이 시작', W / 2, py); }
  const lines = W < 640 ? ['오른쪽 탭: 점프 (공중에서 한 번 더 = 2단 점프)', '왼쪽 탭: 슬라이드', '포토존: POSE 버튼'] :
    ['SPACE / ↑ : 점프 · 공중에서 한 번 더 2단 점프', '↓ : 슬라이드 (공중에서 누르면 급강하)', 'Z : 포토존 레드카펫 위에서 POSE!', '보석을 모아 SPOTLIGHT 피버 발동 · M 음소거 · P 일시정지'];
  ctx.font = `600 ${Math.max(11, 13 * S)}px ${KF}`;
  lines.forEach((l, i) => { const k = clamp((t - 1.3 - i * .1) / .4, 0, 1); ctx.globalAlpha = k * .9; ctx.fillStyle = '#ffeef6'; ctx.fillText(l, W / 2 + (1 - k) * 40, py + 32 * S + i * 21 * S); });
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  if (BEST > 0) { ctx.font = `800 ${12 * S + 2}px ${FT}`; ctx.fillStyle = '#ffd36e'; ctx.fillText('BEST  ' + BEST.toLocaleString(), W / 2, H - 20 * S); }
}
function drawOver() {
  const k = ease.outCubic(clamp(G.overShow, 0, 1));
  ctx.fillStyle = `rgba(20,5,25,${.6 * k})`; ctx.fillRect(0, 0, W, H);
  const size = Math.min(84 * S, W / 7);
  ctx.save(); ctx.translate(W / 2, H * .3); const sc = lerp(1.8, 1, ease.outBack(clamp(G.overShow / .6, 0, 1))); ctx.scale(sc, sc); ctx.globalAlpha = k;
  ctx.font = `italic 900 ${size}px ${FS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,90,160,.7)'; ctx.fillText("Show's Over", 4, 4); ctx.fillStyle = '#fff'; ctx.fillText("Show's Over", 0, 0);
  ctx.restore(); ctx.globalAlpha = 1;
  const rows = [['SCORE', Math.floor(G.score).toLocaleString()], ['BEST', BEST.toLocaleString()], ['DISTANCE', Math.floor(G.dist) + ' m'], ['MAX COMBO', G.maxCombo + ''], ['PERFECT', G.perfects + ''], ['POSE', G.poses + '']];
  rows.forEach((r, i) => {
    const a = clamp((G.overShow - .4 - i * .1) / .3, 0, 1), y = H * .42 + i * 28 * Math.max(.85, S), x = (1 - ease.outCubic(a)) * 50;
    ctx.globalAlpha = a; ctx.font = `800 ${13 * Math.max(.85, S)}px ${FT}`; ctx.textAlign = 'right'; ctx.fillStyle = '#ffc6de'; ctx.fillText(r[0], W / 2 - 14 + x, y);
    ctx.font = `900 ${19 * Math.max(.85, S)}px ${FT}`; ctx.textAlign = 'left'; ctx.fillStyle = i === 1 && G.newBest ? '#ffd36e' : '#fff'; ctx.fillText(r[1], W / 2 + 14 + x, y);
  });
  if (G.newBest) { const a = clamp((G.overShow - 1) / .3, 0, 1); ctx.globalAlpha = a; ctx.save(); ctx.translate(Math.min(W / 2 + 150 * S, W - 55 * S), H * .42 + 50 * S); ctx.rotate(-.2); ctx.scale(ease.outBack(a), ease.outBack(a)); ctx.fillStyle = '#ffd36e'; ctx.font = `italic 900 ${18 * S}px ${FT}`; ctx.textAlign = 'center'; ctx.fillText('NEW BEST!', 0, 0); ctx.restore(); }
  ctx.globalAlpha = G.overShow > 1.2 ? (Math.floor(tReal * 2) % 2 ? .4 : 1) : 0;
  ctx.font = `900 ${Math.max(14, 18 * S)}px ${KF}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('탭 / SPACE 로 다시 런웨이에', W / 2, H * .42 + 6 * 28 * Math.max(.85, S) + 30 * S);
  ctx.globalAlpha = 1;
}

/* ===================== MAIN LOOP ===================== */
function update(rdt) {
  tReal += rdt;
  FX.shake *= Math.exp(-rdt * 8); FX.zoom *= Math.exp(-rdt * 5); FX.flash = Math.max(0, FX.flash - rdt * 2.5); FX.red = Math.max(0, FX.red - rdt * 1.8);
  FX.slowT -= rdt; FX.ts = lerp(FX.ts, FX.slowT > 0 ? FX.slowTo : 1, 1 - Math.exp(-rdt * 12));
  for (const b of BANNERS) b.t += rdt; BANNERS = BANNERS.filter(b => b.t < b.dur);
  if (state === 'over') G.overShow += rdt;
  if (FX.mag) FX.mag.t += rdt; if (FX.slam) FX.slam.t += rdt;
  musicTick();
  if (state === 'pause') return;
  if (FX.hitStop > 0) { FX.hitStop -= rdt; return; }
  const dt = rdt * FX.ts;
  if (state === 'title') updatePlayer(dt); else updateGame(dt);
  updateScene(dt); updateFx(dt);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.save();
  const z = 1 + FX.zoom, sx = R(-1, 1) * FX.shake, sy = R(-1, 1) * FX.shake;
  const fx = P ? P.x : W / 2, fy = P ? P.y - 60 * S : H / 2;
  ctx.translate(fx + sx, fy + sy); ctx.scale(z, z); ctx.translate(-fx, -fy);
  drawWorldBack(); drawSnow(false); drawZoneBack(); drawGround(); drawReflection();
  for (const o of OBS) drawObstacle(o);
  drawItems(); drawPlayer(); drawParticles(); drawSnow(true); drawSpeedLines(); drawPopups();
  ctx.restore();
  ctx.drawImage(VIG, 0, 0, W, H);
  if (FX.flash > 0) { ctx.fillStyle = `rgba(${FX.flashCol},${Math.min(1, FX.flash) * .85})`; ctx.fillRect(0, 0, W, H); }
  if (FX.red > 0) { const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7); g.addColorStop(0, 'rgba(255,0,60,0)'); g.addColorStop(1, `rgba(255,30,80,${FX.red * .6})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else { drawHUD(); drawMagazine(); drawSlam(); if (state === 'over') drawOver(); }
  drawBanners();
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(20,5,25,.6)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = `italic 900 ${48 * S}px ${FS}`; ctx.fillText('Paused', W / 2, H / 2); ctx.font = `600 ${15 * S}px ${KF}`; ctx.fillStyle = '#ffd6e8'; ctx.fillText('P / 탭으로 계속', W / 2, H / 2 + 36 * S);
  }
  if (MUTED) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = `800 11px ${FT}`; ctx.textAlign = 'right'; ctx.fillText('MUTED (M)', W - 14, H - 12); }
}
let last = performance.now();
function frame(t) { if (innerWidth !== W || innerHeight !== H) resize(); const rdt = Math.min(.05, Math.max(0, (t - last) / 1000)); last = t; update(rdt); draw(); requestAnimationFrame(frame); }
addEventListener('resize', resize);
resize(); initScene(); initTitle(); requestAnimationFrame(frame);
</script>
