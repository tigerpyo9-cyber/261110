<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Blaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#02040a;color-scheme:dark}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#02040a}}
  :root[data-theme="dark"]{--bg:#02040a}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   SKY BLAZE — 공중전 슈팅 게임 (단일 파일, 외부 에셋 없음)
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, VIG = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  // 비네트 프리렌더
  VIG = document.createElement('canvas'); VIG.width = W; VIG.height = H;
  const g = VIG.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
addEventListener('resize', resize); resize();

const R = (a, b) => a + Math.random() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
};
const FONT = 'Orbitron, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const KFONT = '"Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
let BEST = 0; try { BEST = +localStorage.getItem('skyblaze_best') || 0; } catch (e) { }

/* ===================== AUDIO (합성음) ===================== */
let AC = null, master = null, noiseBuf = null, lastShootSnd = 0, lastHitSnd = 0;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .45; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function sTone(f, d, type, vol, slide) {
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide && slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .02);
}
function sNoise(d, vol, f0, f1) {
  if (!AC) return; const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + d + .02);
}
const sfx = {
  shoot() { const n = performance.now(); if (n - lastShootSnd < 70) return; lastShootSnd = n; sTone(R(900, 1000), .05, 'square', .018, .45); },
  hit() { const n = performance.now(); if (n - lastHitSnd < 45) return; lastHitSnd = n; sTone(R(260, 340), .04, 'square', .025, .6); },
  boom(big) { sNoise(big ? 1.6 : .55, big ? .7 : .28, big ? 2000 : 2600, 50); sTone(big ? 65 : 120, big ? 1.1 : .35, 'sine', big ? .55 : .22, .3); },
  missile() { sNoise(.3, .06, 3500, 500); },
  pickup() { sTone(660, .09, 'triangle', .12, 1); setTimeout(() => sTone(990, .14, 'triangle', .12, 1.5), 70); },
  hurt() { sTone(170, .35, 'sawtooth', .14, .35); sNoise(.35, .25, 1500, 100); },
  special() { sTone(90, 1.3, 'sawtooth', .22, 6); sNoise(1.8, .55, 5000, 60); },
  warn() { sTone(520, .35, 'square', .07, 1); setTimeout(() => sTone(390, .35, 'square', .07, 1), 380); },
  roll() { sNoise(.4, .14, 500, 3500); },
  dash() { sTone(300, .3, 'sawtooth', .05, 3); },
  laser() { sTone(80, 1.6, 'sawtooth', .1, 1.6); sNoise(1.6, .12, 900, 300); },
  graze() { sTone(1800, .03, 'sine', .03, 1); },
  thunder() { sNoise(2.2, .35, 400, 40); },
};

/* ===================== INPUT ===================== */
const keys = {}; const mouse = { x: 0, y: 0, active: false }; let touchT = null, lastTap = 0;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return; keys[e.code] = true; audioInit(); onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (state === 'play') mouse.active = true; });
cv.addEventListener('mousedown', e => {
  audioInit(); mouse.x = e.clientX; mouse.y = e.clientY;
  if (state === 'title') return startGame();
  if (state === 'over') return tryRestart();
  if (state === 'pause') { state = 'play'; return; }
  mouse.active = true;
  if (e.button === 2) trySpecial(); else tryRoll();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => {
  e.preventDefault(); audioInit();
  if (state === 'title') return startGame();
  if (state === 'over') return tryRestart();
  if (state === 'pause') { state = 'play'; return; }
  if (e.touches.length >= 2) { trySpecial(); return; }
  const t = e.touches[0]; const now = performance.now();
  if (now - lastTap < 280) tryRoll(); lastTap = now;
  touchT = { x: t.clientX, y: t.clientY - 90 }; mouse.active = false;
}, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; if (t) touchT = { x: t.clientX, y: t.clientY - 90 }; }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); if (!e.touches.length) touchT = null; }, { passive: false });

function onKey(c) {
  if (state === 'title' && (c === 'Enter' || c === 'Space')) return startGame();
  if (state === 'over' && (c === 'Enter' || c === 'KeyR' || c === 'Space')) return tryRestart();
  if (c === 'KeyP' || c === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; return; }
  if (state === 'pause' && (c === 'Enter' || c === 'Space')) { state = 'play'; return; }
  if (state !== 'play') return;
  if (c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyK' || c === 'KeyC') tryRoll();
  if (c === 'KeyX' || c === 'KeyL' || c === 'KeyE') trySpecial();
}

/* ===================== SPRITE CACHE ===================== */
const glowCache = {};
function glow(rgb) {
  if (glowCache[rgb]) return glowCache[rgb];
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, `rgba(${rgb},1)`);
  gr.addColorStop(.45, `rgba(${rgb},.35)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return glowCache[rgb] = c;
}
function drawGlow(rgb, x, y, r, a) { if (a <= 0 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glow(rgb), x - r, y - r, r * 2, r * 2); }

function makeCloud(w) {
  const c = document.createElement('canvas'); c.width = w; c.height = w * .7 | 0; const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    const x = R(w * .2, w * .8), y = R(c.height * .3, c.height * .7), r = R(w * .1, w * .22);
    const gr = g.createRadialGradient(x - r * .2, y - r * .3, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(.55, 'rgba(230,238,252,.55)'); gr.addColorStop(1, 'rgba(210,222,245,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  return c;
}
function makeIsland(s) {
  const c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
  const cx = s / 2, cy = s / 2, n = 30, base = s * .3, k = [R(0, TAU), R(0, TAU), R(0, TAU)], pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, r = base * (1 + .25 * Math.sin(a * 2 + k[0]) + .15 * Math.sin(a * 3 + k[1]) + .08 * Math.sin(a * 5 + k[2]));
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  const poly = (sc, fill, ox = 0, oy = 0) => { g.beginPath(); pts.forEach((p, i) => { const x = cx + p[0] * sc + ox, y = cy + p[1] * sc + oy; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.fillStyle = fill; g.fill(); };
  poly(1.38, 'rgba(110,220,230,.18)'); poly(1.22, 'rgba(120,225,225,.28)'); poly(1.1, 'rgba(160,235,220,.45)');
  poly(1.0, '#e6d398'); poly(.9, '#5a9e4c'); poly(.7, '#468a3f'); poly(.45, '#376f35', 4, 4); poly(.25, '#6f7a5d', 6, 4);
  for (let i = 0; i < 70; i++) {
    const a = R(0, TAU), r = R(0, base * .8);
    g.fillStyle = `rgba(${RI(25, 45)},${RI(70, 105)},${RI(30, 45)},.75)`; g.beginPath(); g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, R(2, 5.5), 0, TAU); g.fill();
  }
  return c;
}

/* ===================== THEMES ===================== */
const THEMES = [
  { name: 'DAWN PATROL', sea: ['#0f6394', '#06355a'], tint: 'rgba(255,190,120,0.08)', cloud: 1 },
  { name: 'SUNSET STRIKE', sea: ['#285683', '#16264a'], tint: 'rgba(255,95,40,0.22)', cloud: .9 },
  { name: 'MIDNIGHT RAID', sea: ['#0b2142', '#030915'], tint: 'rgba(30,25,130,0.32)', cloud: .45 },
  { name: 'STORM FRONT', sea: ['#2d4152', '#111a24'], tint: 'rgba(10,20,30,0.28)', cloud: .7, storm: true },
];
const BOSS_NAMES = ['DREADNOUGHT α', 'LEVIATHAN β', 'TEMPEST γ', 'OBLIVION Δ'];

/* ===================== WORLD STATE ===================== */
let state = 'title', P = null, G = null;
let pB = [], eB = [], EN = [], PT = [], RINGS = [], POPS = [], PICK = [], AFTER = [], BANNERS = [];
const FX = { shake: 0, zoom: 0, flash: 0, flashCol: '255,255,255', red: 0, hitStop: 0, slowT: 0, slowTo: .25, ts: 1, spd: 1, spdBoost: 0, burst: null };
const BG = { islands: [], waves: [], low: [], high: [], islandSpr: [], cloudSpr: [] };
let tReal = 0;

function initBg() {
  BG.islandSpr = [260, 320, 380, 440, 520, 300].map(makeIsland);
  BG.cloudSpr = [220, 280, 340, 400, 460, 300, 380].map(makeCloud);
  BG.islands = []; for (let i = 0; i < 4; i++) BG.islands.push(newIsland(R(-200, H)));
  BG.waves = []; for (let i = 0; i < 140; i++) BG.waves.push({ x: R(0, W), y: R(0, H), l: R(5, 16), a: R(.05, .2) });
  BG.low = []; for (let i = 0; i < 7; i++) BG.low.push(newCloud(R(-300, H), false));
  BG.high = []; for (let i = 0; i < 3; i++) BG.high.push(newCloud(R(-H, H), true));
}
function newIsland(y) { const img = BG.islandSpr[RI(0, BG.islandSpr.length - 1)]; return { img, x: R(-100, W + 100) - img.width / 2, y: y ?? -img.height - R(0, 600), par: R(.9, 1.1) }; }
function newCloud(y, high) {
  const img = BG.cloudSpr[RI(0, BG.cloudSpr.length - 1)], sc = high ? R(1.6, 2.6) : R(.7, 1.3);
  return { img, sc, x: R(-img.width * sc * .5, W - img.width * sc * .5), y: y ?? -img.height * sc - R(0, high ? 1400 : 400), par: high ? R(4, 5.5) : R(1.7, 2.3), a: high ? R(.25, .4) : R(.5, .8) };
}
const seaSpeed = () => 150 * FX.spd;

function updateBg(dt) {
  const s = seaSpeed() * dt;
  for (let i = 0; i < BG.islands.length; i++) { const o = BG.islands[i]; o.y += s * o.par; if (o.y > H + 20) BG.islands[i] = newIsland(); }
  for (const w of BG.waves) { w.y += s; if (w.y > H + 10) { w.y = -10; w.x = R(0, W); } }
  for (let i = 0; i < BG.low.length; i++) { const o = BG.low[i]; o.y += s * o.par; if (o.y > H + 30) BG.low[i] = newCloud(undefined, false); }
  for (let i = 0; i < BG.high.length; i++) { const o = BG.high[i]; o.y += s * o.par; if (o.y > H + 30) BG.high[i] = newCloud(undefined, true); }
}
function drawSea(th, a) {
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, th.sea[1]); gr.addColorStop(1, th.sea[0]);
  ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(-60, -60, W + 120, H + 120); ctx.globalAlpha = 1;
}
function drawBg() {
  drawSea(THEMES[G.theme], 1);
  if (G.themeFade > 0) drawSea(THEMES[G.themePrev], G.themeFade);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for (const w of BG.waves) { ctx.globalAlpha = w.a * (.6 + .4 * Math.sin(tReal * 3 + w.x)); ctx.beginPath(); ctx.moveTo(w.x - w.l / 2, w.y); ctx.lineTo(w.x + w.l / 2, w.y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const o of BG.islands) ctx.drawImage(o.img, o.x, o.y);
  const ca = THEMES[G.theme].cloud;
  for (const o of BG.low) { ctx.globalAlpha = o.a * ca; ctx.drawImage(o.img, o.x, o.y, o.img.width * o.sc, o.img.height * o.sc); }
  ctx.globalAlpha = 1;
}
function drawHighClouds() {
  const ca = THEMES[G.theme].cloud;
  for (const o of BG.high) { ctx.globalAlpha = o.a * ca; ctx.drawImage(o.img, o.x, o.y, o.img.width * o.sc, o.img.height * o.sc); }
  ctx.globalAlpha = 1;
}

/* ===================== GAME SETUP ===================== */
function makeG() {
  return { score: 0, shownScore: 0, combo: 0, comboT: 0, comboPulse: 0, maxCombo: 0, wave: 1, waveT: 0, spawnT: 1.5, bossPhase: false, bossT: 0,
    nextWaveT: 0, time: 0, overT: 0, overShow: 0, theme: 0, themePrev: 0, themeFade: 0, kills: 0, boss: null, bossBarLag: 1, bossShow: 0 };
}
function newPlayer() {
  return { x: W / 2, y: H * .78, vx: 0, vy: 0, hp: 100, hpLag: 100, bank: 0, roll: 0, rollT: 0, rollCd: 0, rollDir: 1, inv: 0, power: 1,
    fireT: 0, missT: .5, special: 0, alive: true, trail: [[], []], muzzle: 0 };
}
function clearWorld() { pB = []; eB = []; EN = []; PT = []; RINGS = []; POPS = []; PICK = []; AFTER = []; BANNERS = []; }
function initDemo() { clearWorld(); G = makeG(); P = newPlayer(); state = 'title'; }
function startGame() {
  audioInit(); clearWorld(); G = makeG(); P = newPlayer(); P.y = H + 60; P.vy = -900; state = 'play';
  mouse.active = false; touchT = null;
  FX.spdBoost = 2.2; FX.flash = .6; FX.flashCol = '255,255,255'; FX.zoom = .06;
  ring(W / 2, H * .75, Math.max(W, H) * .7, .8, 10, '120,220,255');
  banner('WAVE 1', THEMES[0].name + ' · 적 편대를 격추하라', '100,210,255');
}
function tryRestart() { if (G.overShow > 1) startGame(); }

/* ===================== FX HELPERS ===================== */
function part(o) {
  if (PT.length > 2400) return;
  o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0; o.grow = o.grow || 0; o.drag = o.drag ?? 1; o.rot = o.rot || 0; o.vr = o.vr || 0; o.drift = o.drift ?? .7;
  PT.push(o);
}
function ring(x, y, maxR, dur, w, rgb) { RINGS.push({ x, y, maxR, dur, w, rgb, t: 0 }); }
function popup(x, y, text, size, color, dur = 1) { POPS.push({ x, y, text, size, color, dur, t: 0 }); }
function banner(title, sub, rgb, kind = 'normal', dur = 2.6) { BANNERS.push({ title, sub, rgb, kind, t: 0, dur }); }
function shake(v) { FX.shake = Math.max(FX.shake, v); }
function slowmo(t, to = .25) { FX.slowT = Math.max(FX.slowT, t); FX.slowTo = to; }

function sparks(x, y, n, rgb = '255,220,150', sp = 400) {
  for (let i = 0; i < n; i++) { const a = R(0, TAU), v = R(sp * .3, sp); part({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.15, .4), drag: .02, rgb, drift: .3 }); }
}
function explode(x, y, s, rgb = '255,170,70') {
  const q = Math.sqrt(s);
  part({ type: 'glow', x, y, life: .18, size: 60 * q, grow: 300 * q, rgb: '255,245,220', drift: 0 });
  for (let i = 0; i < 9 * s; i++) { const a = R(0, TAU), v = R(20, 230) * q; part({ type: 'fire', x: x + R(-8, 8) * q, y: y + R(-8, 8) * q, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.35, .8), size: R(10, 22) * Math.pow(s, .45), grow: 25, drag: .08 }); }
  for (let i = 0; i < 6 * s; i++) { const a = R(0, TAU), v = R(10, 140) * q; part({ type: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.9, 1.8), size: R(8, 18) * q, grow: R(20, 45), drag: .15 }); }
  for (let i = 0; i < 8 * s; i++) { const a = R(0, TAU), v = R(250, 750) * q; part({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.2, .55), drag: .03, rgb: '255,210,130', drift: .3 }); }
  for (let i = 0; i < 3 * s; i++) { const a = R(0, TAU), v = R(100, 380) * q; part({ type: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.7, 1.4), size: R(3, 7), drag: .3, rot: R(0, TAU), vr: R(-14, 14) }); }
  ring(x, y, 55 * s, .45 + s * .04, 7 * q, rgb);
  if (s >= 3) ring(x, y, 100 * s, .7, 3, '255,255,255');
  shake(3.5 * s); if (s >= 3) { FX.hitStop = Math.max(FX.hitStop, .045); FX.zoom = Math.max(FX.zoom, .015 * s); }
  sfx.boom(s >= 3);
}

/* ===================== PLAYER ===================== */
const ROLL_DUR = .5, SPD = 470;
function tryRoll() {
  if (state !== 'play' || !P.alive || P.rollCd > 0) return;
  P.rollT = ROLL_DUR; P.rollCd = .85; P.rollDir = Math.sign(P.vx) || (Math.random() < .5 ? -1 : 1);
  P.vx += P.rollDir * 900; sfx.roll(); ring(P.x, P.y, 70, .35, 3, '160,230,255');
}
function trySpecial() {
  if (state !== 'play' || !P.alive) return;
  if (P.special < 100) { popup(P.x, P.y - 50, 'OVERDRIVE ' + Math.floor(P.special) + '%', 14, '#8fd8ff', .6); return; }
  P.special = 0; P.inv = Math.max(P.inv, 1.2);
  slowmo(.55, .2); FX.flash = 1; FX.flashCol = '200,240,255'; shake(26); FX.zoom = .12; FX.spdBoost = 2.5;
  FX.burst = { x: P.x, y: P.y, t: 0 };
  for (let i = 0; i < 4; i++) setTimeout(() => ring(P.x, P.y, Math.max(W, H) * (1 + i * .2), .9 + i * .15, 16 - i * 3, i % 2 ? '255,255,255' : '90,210,255'), i * 90);
  for (const b of eB) { part({ type: 'glow', x: b.x, y: b.y, life: .5, size: 14, grow: -20, rgb: '120,220,255' }); G.score += 10; }
  eB = [];
  for (const e of EN) if (!e.dead) hitEnemy(e, e.type === 'boss' ? 120 : 60, e.x, e.y);
  sfx.special(); popup(W / 2, H * .45, 'OVERDRIVE!!', 54, '#7fe0ff', 1.4);
}
function updatePlayer(dt, demo) {
  const p = P; if (!p.alive) return;
  let tvx = 0, tvy = 0;
  if (demo) {
    const t = G.time, tx = W / 2 + Math.sin(t * .7) * W * .28, ty = H * .68 + Math.sin(t * 1.4) * H * .1;

  } else {

  if (state === 'pause') return;
  if (FX.hitStop > 0) { FX.hitStop -= rdt; return; }

  FX.spd = lerp(FX.spd, tgt, 1 - Math.exp(-dt * 4));

  const demo = state === 'title';
  G.time += dt;
  updatePlayer(dt, demo);

  drawHighClouds(); drawSpeedLines(); drawPopups();

  ctx.fillStyle = THEMES[G.theme].tint; ctx.fillRect(0, 0, W, H);
  if (FX.flash > 0) { ctx.fillStyle = `rgba(${FX.flashCol},${Math.min(1, FX.flash) * .85})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(VIG, 0, 0, W, H);

    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,20,30,${red * .7})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

    ctx.fillStyle = '#fff'; ctx.font = `900 italic 48px ${FONT}`; ctx.textAlign = 'center'; spaced('PAUSED', W / 2, H / 2, 10);
    ctx.font = `600 15px ${KFONT}`; ctx.fillStyle = '#9fd8ff'; ctx.fillText('P / ESC / 클릭으로 계속', W / 2, H / 2 + 40);
  }
}
let last = performance.now();

initBg(); initDemo(); requestAnimationFrame(frame);
